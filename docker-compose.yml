services:
  xoft-core:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      STORAGE_MODE: sqlite
      SQLITE_PATH: /app/data/xoft.sqlite
      BROWSER_PROVIDER: ${BROWSER_PROVIDER:-lightpanda}
      LIGHTPANDA_CDP_URL: ${LIGHTPANDA_CDP_URL:-ws://lightpanda:9222}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - xoft-data:/app/data
    depends_on:
      lightpanda:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  lightpanda:
    image: lightpanda/browser:latest
    restart: unless-stopped
    command: ["lightpanda", "serve", "--host", "0.0.0.0", "--port", "9222"]
    expose:
      - "9222"
volumes:
  xoft-data:
